; Dev tuning for `php artisan serve` on a Windows bind mount.
; Without OPcache (off by default in the CLI SAPI) every request re-reads and re-parses
; all framework files over the slow file share.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=2

; Cache resolved file paths (stat() calls are the expensive part on the share).
realpath_cache_size=4096K
realpath_cache_ttl=600
