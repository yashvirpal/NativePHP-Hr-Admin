# Public-facing gateway for the HTTPS tunnel.
#
# Only the mobile employee API is reachable through it. The admin panel (/admin), the employee web
# portal (/employee), health checks and everything else get a plain 404, so exposing this to the
# internet never exposes the back-office.
server {
    listen 80;
    server_tokens off;

    client_max_body_size 1m;

    location /api/v1/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
